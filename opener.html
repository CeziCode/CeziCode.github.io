<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teaser Page</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

    body {
      margin: 0;
      height: 100vh;
      background-color: #000;
      font-family: 'Orbitron', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .background-text {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: flex;
      flex-wrap: wrap;
      font-size: 1.5rem;
      color: rgba(255, 255, 255, 0.07);
      font-weight: bold;
    }

    .background-text span {
      flex: 0 0 auto;
      margin: 0 10px;
    }

    .logo {
      position: relative;
      z-index: 2;
    }

    .logo img {
      max-width: 300px;
      filter: drop-shadow(0 0 8px #fff);
    }

    .email-box {
      position: relative;
      margin-top: 20px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .email-input {
      font-size: 1.2rem;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid #f5b3c8;
      padding: 10px 20px;
      border-radius: 5px;
      outline: none;
      backdrop-filter: blur(5px);
      width: 300px;
      text-align: center;
    }

    .email-input::placeholder {
      color: #f5b3c8;
    }

    .submit-button {
      font-size: 1rem;
      color: #fff;
      background: #f5b3c8;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
      font-family: 'Orbitron', sans-serif;
    }

    .submit-button:hover {
      background: #e892af;
    }
  </style>
</head>
<body>
  <div class="background-text">
    <!-- Generate repeated text for background -->
    <script>
      for (let i = 0; i < 500; i++) {
        document.write('<span>XX/XX/25</span>');
      }
    </script>
  </div>
  <div class="logo">
    <img src="websitetease (2).png" alt="Logo">
  </div>
  <div class="email-box">
    <input type="email" class="email-input" placeholder="exampleemail@elissier.co.uk">
    <button class="submit-button">Submit</button>
  </div>
</body>
</html>
