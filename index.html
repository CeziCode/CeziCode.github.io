<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Elissier – Urban Apparel</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@400;700&display=swap');

    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #0f0f0f;
      color: white;
    }

    header {
      background-color: #111;
      padding: 1rem 2rem;
      text-align: center;
    }

    header h1 {
      font-family: 'Anton', sans-serif;
      font-size: 2.5rem;
      margin: 0;
      background: linear-gradient(to right, #9b5de5, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero {
      background-image: url('https://images.unsplash.com/photo-1614281099690-250c861c93b7?auto=format&fit=crop&w=1470&q=80');
      background-size: cover;
      background-position: center;
      height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .hero h2 {
      background-color: rgba(0, 0, 0, 0.7);
      padding: 1rem 2rem;
      font-size: 2rem;
      letter-spacing: 2px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 2rem;
      padding: 2rem;
    }

    .product {
      background-color: #1a1a1a;
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
      transition: transform 0.2s ease;
    }

    .product:hover {
      transform: scale(1.05);
    }

    .product img {
      width: 100%;
      border-radius: 5px;
    }

    .product h3 {
      margin: 0.5rem 0;
    }

    /* MODAL STYLES */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background-color: #1a1a1a;
      padding: 2rem;
      border-radius: 10px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      position: relative;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-content h2 {
      font-family: 'Anton', sans-serif;
      background: linear-gradient(to right, #9b5de5, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2rem;
    }

    .modal-content p {
      color: #ccc;
      margin-bottom: 1.5rem;
    }

    .modal-content input[type="email"] {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1rem;
      border: none;
      border-radius: 5px;
      background-color: #111;
      color: white;
    }

    .modal-content button {
      padding: 0.7rem 1.2rem;
      background: linear-gradient(to right, #9b5de5, #ffffff);
      color: #0f0f0f;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .modal-content button:hover {
      background: linear-gradient(to right, #ffffff, #9b5de5);
    }

    .close {
      position: absolute;
      top: 10px;
      right: 15px;
      color: #aaa;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .close:hover {
      color: white;
    }

    .success-message {
      display: none;
      color: #32cd32;
      font-weight: bold;
      margin-top: 1rem;
    }

    .subscribe-link {
      background-color: #111;
      text-align: center;
      padding: 2rem;
    }

    .subscribe-link button {
      color: #0f0f0f;
      background: linear-gradient(to right, #9b5de5, #ffffff);
      padding: 0.7rem 1.5rem;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s ease;
    }

    .subscribe-link button:hover {
      background: linear-gradient(to right, #ffffff, #9b5de5);
    }
  </style>
</head>
<body>

  <header>
    <h1>ELISSIER</h1>
  </header>

  <section class="hero">
    <h2>NEW DROP | SUMMER '25 COLLECTION</h2>
  </section>

  <section class="products">
    <div class="product">
      <img src="https://via.placeholder.com/300x300?text=Hoodie+1" alt="Hoodie">
      <h3>Shadow Hoodie</h3>
      <p>$79.99</p>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/300x300?text=Shirt+1" alt="Shirt">
      <h3>Urban Tee</h3>
      <p>$39.99</p>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/300x300?text=Cap+1" alt="Cap">
      <h3>Snapback Cap</h3>
      <p>$24.99</p>
    </div>
  </section>

  <section class="subscribe-link">
    <h2>Want the Drop?</h2>
    <p>Get notified before anyone else.</p>
    <button onclick="openModal()">Subscribe to Newsletter</button>
  </section>

  <!-- MODAL -->
  <div id="subscribeModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2>Join the Drop</h2>
      <p>Be the first to know about drops, sales, and streetwear exclusives.</p>
      <form onsubmit="submitForm(event)">
        <input type="email" placeholder="Your email address" required />
        <button type="submit">Sign Up</button>
      </form>
      <div class="success-message" id="successMsg">Thanks for subscribing!</div>
    </div>
  </div>

  <script>
    // Auto-open the modal after a short delay on page load
    window.onload = function () {
      setTimeout(() => {
        document.getElementById("subscribeModal").style.display = "flex";
      }, 1000); // 1-second delay
    };

    function openModal() {
      document.getElementById("subscribeModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("subscribeModal").style.display = "none";
    }

    function submitForm(event) {
      event.preventDefault();
      document.getElementById("successMsg").style.display = "block";
      setTimeout(closeModal, 2000);
    }

    // Close modal when clicking outside it
    window.onclick = function(event) {
      const modal = document.getElementById("subscribeModal");
      if (event.target === modal) {
        closeModal();
      }
    };
  </script>

</body>
</html>
